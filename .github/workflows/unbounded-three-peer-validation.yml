name: Validate unbounded Three peer

on:
  push:
    branches:
      - compat/unbounded-three-peer

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: compat/unbounded-three-peer
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "Patrick van Halm"
          git config user.email "99954741+Patrick-van-Halm-360Fabriek@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync lockfile for unbounded Three peer"
          git push origin HEAD:compat/unbounded-three-peer
