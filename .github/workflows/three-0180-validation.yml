name: Validate Three 0.180 compatibility

on:
  push:
    branches:
      - compat/three-0.180

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: compat/three-0.180
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - name: Adapt custom default attributes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/materials/point-cloud-material.ts')
          text = path.read_text()
          old = """    this.defaultAttributeValues.normal = [0, 0, 0];
    this.defaultAttributeValues.classification = [0, 0, 0];
    this.defaultAttributeValues.indices = [0, 0, 0, 0];
"""
          new = """    const defaultAttributeValues = this.defaultAttributeValues as unknown as Record<string, number[]>;
    defaultAttributeValues.normal = [0, 0, 0];
    defaultAttributeValues.classification = [0, 0, 0];
    defaultAttributeValues.indices = [0, 0, 0, 0];
"""
          if old not in text:
              raise SystemExit('Expected default attribute block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install cleanly
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit compatibility updates
        run: |
          if git diff --quiet -- package-lock.json src/materials/point-cloud-material.ts; then
            exit 0
          fi
          git config user.name "Patrick van Halm"
          git config user.email "99954741+Patrick-van-Halm-360Fabriek@users.noreply.github.com"
          git add package-lock.json src/materials/point-cloud-material.ts
          git commit -m "Adapt point cloud material to Three 0.180"
          git push origin HEAD:compat/three-0.180
